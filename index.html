<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Year Progress Review Availability Poll</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .timezone-note {
      background: #eef4fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .name-label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 25px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .slot {
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .slot label {
      display: flex;
      gap: 12px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      margin-top: 5px;
      transform: scale(1.25);
    }

    .melbourne {
      font-weight: bold;
    }

    .singapore {
      color: #666;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>2-Year Progress Review</h1>

  <div class="intro">
    Thank you for helping me schedule my 2-year Progress Review milestone.
    <br>
    Please enter your name and select <strong>all time slots when you are available</strong>.
  </div>

  <div class="timezone-note">
    <strong>Time zones:</strong><br>
    Melbourne — AEDT (UTC+11)<br>
    Singapore — SGT (UTC+8)
  </div>

  <form id="availabilityForm">

    <label class="name-label" for="name">Your name</label>
    <input
      type="text"
      id="name"
      placeholder="Please enter your name"
      required
    >

    <h3>Please select all available times:</h3>

    <div class="slot">
      <label>
        <input type="checkbox" id="slot1">
        <div>
          <div class="melbourne">
            Tuesday, 20 October 2026 — 1:00 pm Melbourne
          </div>
          <div class="singapore">
            10:00 am Singapore
          </div>
        </div>
      </label>
    </div>

    <div class="slot">
      <label>
        <input type="checkbox" id="slot2">
        <div>
          <div class="melbourne">
            Wednesday, 21 October 2026 — 10:00 am Melbourne
          </div>
          <div class="singapore">
            7:00 am Singapore
          </div>
        </div>
      </label>
    </div>

    <div class="slot">
      <label>
        <input type="checkbox" id="slot3">
        <div>
          <div class="melbourne">
            Thursday, 22 October 2026 — 11:00 am Melbourne
          </div>
          <div class="singapore">
            8:00 am Singapore
          </div>
        </div>
      </label>
    </div>

    <div class="slot">
      <label>
        <input type="checkbox" id="slot4">
        <div>
          <div class="melbourne">
            Thursday, 22 October 2026 — 1:00 pm Melbourne
          </div>
          <div class="singapore">
            10:00 am Singapore
          </div>
        </div>
      </label>
    </div>

    <div class="slot">
      <label>
        <input type="checkbox" id="slot5">
        <div>
          <div class="melbourne">
            Friday, 23 October 2026 — 2:00 pm Melbourne
          </div>
          <div class="singapore">
            11:00 am Singapore
          </div>
        </div>
      </label>
    </div>

    <button type="submit" id="submitButton">
      Submit Availability
    </button>

  </form>

  <div id="message"></div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUOgXtUaNZnUyDvbOOlC3_3j6y-7-pQY3u9DxBTy5MGWiODBsJ04eCNHtVMSIskt4/exec";

const form = document.getElementById("availabilityForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();

  if (!name) {
    message.textContent = "Please enter your name.";
    message.className = "error";
    return;
  }

  const slots = [
    document.getElementById("slot1").checked,
    document.getElementById("slot2").checked,
    document.getElementById("slot3").checked,
    document.getElementById("slot4").checked,
    document.getElementById("slot5").checked
  ];

  if (!slots.some(Boolean)) {
    message.textContent = "Please select at least one available time.";
    message.className = "error";
    return;
  }

  const data = {
    name: name,
    slot1: slots[0] ? "Available" : "Not available",
    slot2: slots[1] ? "Available" : "Not available",
    slot3: slots[2] ? "Available" : "Not available",
    slot4: slots[3] ? "Available" : "Not available",
    slot5: slots[4] ? "Available" : "Not available"
  };

  submitButton.disabled = true;
  submitButton.textContent = "Submitting...";
  message.textContent = "";

  try {
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    message.textContent = "Thank you! Your availability has been submitted.";
    message.className = "success";
    form.reset();

  } catch (error) {
    message.textContent = "There was a problem submitting your response. Please try again.";
    message.className = "error";
  }

  submitButton.disabled = false;
  submitButton.textContent = "Submit Availability";
});
</script>

</body>
</html>
